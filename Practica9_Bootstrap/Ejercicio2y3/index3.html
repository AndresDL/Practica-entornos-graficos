<html>
    <!DOCTYPE html>
    <head>
        
        <meta charset="UTF-8"/>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

        <!--Necesario el uso de js para poder poner en funcionamiento al menu modal.-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

        <link href="estilos.css" rel="stylesheet">

    </head>
    <body>
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="p-1 topbar">columna arriba</div>
                </div>
            </div>
            <div class="row">
                <!--2) Dentro del sidebar, añadir un botón. Al presionar el botón deberá desplegarse un modal con 2 botones: 
                uno para cerrarlo y otro que diga “guardar cambios”. Al tener 2 dependiendo de la visualización, hay insertarlo 2 veces.-->
                <div class="d-none d-md-block  col-md-3">
                    <div class="p-1 h-100 sidebar">
                        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
                            INVOCAR AL MODAL
                        </button>
                    </div>
                </div>
                <div class="d-block d-md-none  col-12">
                    <div class="p-1 sidebar">
                        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
                            INVOCAR AL MODAL
                        </button>
                    </div>
                </div>
                <div class="col-12 col-md-9">
                    <!--1) En el div de color verde creado en el ejercicio anterior, agregarle un componente de alerta que tenga 
                    la clase alert-success con un texto cualquiera. En mi caso seria midbar o barra del medio.-->
                    <div class="p-1 midbar">
                        <div class="alert alert-success" role="alert">
                            ¡ALERTA ALERTA ESTA PAGINA ES UN EXITO (PARCIAL)!
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-6 col-md-3">
                            <div class="p-2 rectangle">
                                <!--Honestamente no se como resolver esto, es lo mejor que pude hacer.-->
                                <div class="card" style="width: 18rem;">
                                    <img src="..." class="card-img-top" alt="...">
                                    <div class="card-body">
                                        <h5 class="card-title">Card title</h5>
                                        <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card's content.</p>
                                        <a href="#" class="btn btn-primary">Go somewhere</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="p-2 rectangle">rectangle</div>
                        </div>
                        <div class="col-3 d-none d-md-block">
                            <div class="p-2 rectangle">rectangle</div>
                        </div>
                    </div>  
                    <div class="row">
                        <div class="col-6 col-md-3">
                            <div class="p-2 rectangle">rectangle</div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="p-2 rectangle">rectangle</div>
                        </div>
                        <div class="col-3 d-none d-md-block">
                            <div class="p-2 rectangle">rectangle</div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-6 col-md-4">
                            <div class="p-5 bottombar">barra de abajo</div>
                        </div>
                        <div class="col-6 col-md-6">
                            <div class="p-5 bottombar">
                                <div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel">
                                    <div class="carousel-inner">
                                        <div class="carousel-item active">
                                        <img src="bbb.jpg" class="d-block w-100" alt="...">
                                        </div>
                                        <div class="carousel-item">
                                        <img src="ccc.png" class="d-block w-100" alt="...">
                                        </div>
                                        <div class="carousel-item">
                                        <img src="html.png" class="d-block w-100" alt="...">
                                        </div>
                                    </div>
                                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="prev">
                                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                        <span class="visually-hidden">Previous</span>
                                    </button>
                                    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="next">
                                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                        <span class="visually-hidden">Next</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!--Definición del modal a ser invocado por la sidebar-->
            <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="exampleModalLabel">Titulo del modal</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            ¡ESTE MODAL ES UN EXITO!
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                            <button type="button" class="btn btn-primary">Guardar cambios</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
