<html>
    <!DOCTYPE html>
    <style>
    </style>
    <head>
        <meta charset="UTF-8"/>
        <title>Ejercicio 5</title>
        <style>
            /*Aclaración: si el enunciado dice parrafo asumo <p>, si dice bloque asumo <div>, si dice titulo asumo h1*/

            /*1. Los textos enfatizados dentro de cualquier título deben ser rojos.*/
            h1{
                color: red;
            }

            /*2. Cualquier elemento que tenga asignado el atributo "href" y que esté dentro de cualquier párrafo que a su vez esté dentro de 
            un bloque debe ser color negro.*/
            div p [href]{
                color: red;
            }

            /*3. El texto de las listas no ordenadas que estén dentro del bloque identificado como “ultimo” debe ser amarillo pero si es 
            un enlace a otra página debe ser azul.*/
            ul li#ultimo {
            color: yellow;
            }

            ul li#ultimo a {
            color: blue;
            }

            /*4. Los elementos identificados como “importante” dentro de cualquier bloque deben ser verdes, pero si están dentro de un 
            título deben ser rojos.*/
            div *#importante{
                color: green;
            }

            div h1 *#importante {
                color: red;
            }
            
            /*5. Todos los elementos h1 que especifique el atributo title, cualquiera que sea su valor, deben ser azules.*/
            h1[title]{
                color:blue;

            }

            /*6. El color de los enlaces en las listas ordenadas debe ser azul para los enlaces aún no visitados, y violeta para los ya 
            visitados y, además, no deben aparecer subrayados.*/
            ol a:link{
                color: blue;
                
            }

            ol a:visited{
                color: violet;
            }

        </style>
    </head>
    <body>
        <!--Ejemplo 1-->
        <h3>Ejemplos 1</h3><br>
        <h1>Titulo de color rojo</h1><br>

        <!--Ejemplo 2-->
        <h3>Ejemplos 2</h3><br>
        <div>
            <p>
                <a href="">linka</a>
                <table href="">
                    <tr>
                        <td>linktabla</td>
                    </tr>
                </table>
            </p>
        </div>

        <!--Ejemplo 3-->
        <h3>Ejemplos 3</h3><br>
        <ul>
            <li>RAM</li>
            <li>GPU</li>
            <li id="ultimo">CPU</li>
            <li id="ultimo"><a href="https://www.frro.utn.edu.ar/">link a otra pagina</a></li>
        </ul>

        <!--Ejemplo 4-->
        <div>
            <h3>Ejemplos 4</h3><br>
            <p id="importante">parrafo</p>
            <a id="importante">link</a>
            <table id="importante">
                <tr>
                    <td>tabla</td>
                </tr>
            </table>
            <h1><p id="importante">parrafo en titulo</p></h1>
            <h1><a id="importante">link en titulo</a></h1>
            <h1>
                <table id="importante">
                    <tr>
                        <td>tabla en titulo</td>
                    </tr>
                </table>
            </h1>
        </div>

        <!--Ejemplo 5-->
